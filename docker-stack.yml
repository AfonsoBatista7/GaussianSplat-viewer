version: "3.8"

services:
  viewer:
    image: gaussian-splat-viewer:latest
    ports:
      - "8080:80"
    volumes:
      - /srv/www/gaussian-splat/scene.sog:/usr/share/nginx/html/scene.sog:ro
      - /srv/www/gaussian-splat/settings.json:/usr/share/nginx/html/settings.json:ro
    deploy:
      replicas: 1
      placement:
        # bind-mounted files only exist on this host — pin the service there
        constraints:
          - node.hostname == <your-pi-hostname>
      restart_policy:
        condition: on-failure
