server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Matches the project's own serve.json: never let a stale settings.json,
    # scene file, or bundle linger in a browser/proxy cache after a redeploy
    # or a content swap on the mounted volume.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
